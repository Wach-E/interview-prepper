[project]
name = "job-interviewer"
version = "0.1.0"
readme = "README.md"
description = "Agents used to prepare for job interviews"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai==1.15.22",
    "langchain-openai==1.6.6",
    "crewai-tools==1.15.22",
]

[project.scripts]
interview = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
